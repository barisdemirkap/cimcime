[project]
name = "cimcime"
version = "0.2.0"
description = "Cimcime: an autonomous forward-deployed-engineer agent system"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
keywords = ["claude-code", "agents", "forward-deployed-engineer"]

[project.scripts]
cimcime = "cimcime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live GitHub token/network, not run by default",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimcime"]
