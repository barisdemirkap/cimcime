name: deploy

# Self-hosted runner only - deliberately NOT triggered by pull_request, only by a
# push to main (which already requires repo write access). This is the one safe
# trigger for a self-hosted job on a repo that could otherwise accept outside
# contributions: a fork's pull_request can never reach this workflow.
on:
  push:
    branches: [main]

# One deploy at a time, and never alongside the daily claude-code update (both reinstall the
# same launchd service). A newer push waits instead of cancelling a half-finished install.
concurrency:
  group: telegram-bridge-service
  cancel-in-progress: false

jobs:
  deploy-telegram-bridge:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv run pytest -q
      - run: ./scripts/install_telegram_launchd.sh
      - name: Verify the service is actually running
        run: |
          sleep 15
          out="$(launchctl list com.cimcime.telegram-channel)"
          echo "$out"
          echo "$out" | grep -q '"PID"' || { echo "telegram-channel has no running process after deploy" >&2; exit 1; }
